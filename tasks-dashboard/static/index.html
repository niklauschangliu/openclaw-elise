<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenClaw – Tasks Dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a33;
      --text: #e9eefc;
      --muted: #a9b4d6;
      --ok: #5eead4;
      --warn: #fbbf24;
      --bad: #fb7185;
      --line: rgba(255,255,255,0.08);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text); }
    header { padding: 16px 18px; border-bottom: 1px solid var(--line); display:flex; gap:12px; align-items:center; justify-content:space-between; }
    header h1 { font-size: 16px; margin:0; letter-spacing: 0.2px; }
    header .meta { font-size: 12px; color: var(--muted); font-family: var(--mono); }
    main { padding: 16px 18px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
    .card h2 { font-size: 13px; margin:0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
    .kv { display:grid; grid-template-columns: 140px 1fr; gap: 6px 10px; font-size: 13px; }
    .k { color: var(--muted); }
    .v { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    .pill { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-family: var(--mono); border: 1px solid var(--line); }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    button { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-family: var(--mono); font-size: 12px; cursor: pointer; }
    button:hover { border-color: rgba(255,255,255,0.25); }
    pre { margin:0; font-family: var(--mono); font-size: 12px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .small { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>OpenClaw – Tasks Dashboard</h1>
      <div class="meta" id="meta">Loading…</div>
    </div>
    <div class="row">
      <span class="pill" id="pill">fetching</span>
      <button id="refresh">refresh</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Gateway</h2>
      <div class="kv" id="gateway"></div>
    </section>

    <section class="card">
      <h2>Channels</h2>
      <div id="channels"></div>
    </section>

    <section class="card">
      <h2>Sessions</h2>
      <div id="sessions"></div>
    </section>

    <section class="card">
      <h2>Cron</h2>
      <div id="cron"></div>
    </section>

    <section class="card">
      <h2>Raw (debug)</h2>
      <div class="small">If something looks wrong, screenshot this section.</div>
      <pre id="raw"></pre>
    </section>
  </main>

<script>
  const $ = (id) => document.getElementById(id);

  function setPill(kind, text) {
    const el = $('pill');
    el.className = 'pill ' + (kind || '');
    el.textContent = text;
  }

  function kvRows(obj) {
    const entries = Object.entries(obj || {});
    return entries.map(([k, v]) => `<div class="k">${k}</div><div class="v">${String(v ?? '')}</div>`).join('');
  }

  function safeGet(obj, path, fallback) {
    try {
      return path.split('.').reduce((a, k) => a?.[k], obj) ?? fallback;
    } catch {
      return fallback;
    }
  }

  function render(state) {
    $('meta').textContent = `host=${state.host} | ${state.platform} | generatedAt=${state.generatedAt}`;

    // status JSON structure can change; we keep this defensive.
    const status = state.status?.ok ? state.status.data : null;

    const dashboardUrl = safeGet(status, 'overview.dashboard', '');
    const gatewayUrl = safeGet(status, 'overview.gateway', '');
    const tailscale = safeGet(status, 'overview.tailscale', '');

    $('gateway').innerHTML = kvRows({
      dashboard: dashboardUrl,
      gateway: gatewayUrl,
      tailscale
    });

    // Channels
    const channels = state.channels?.ok ? state.channels.data : null;
    if (!channels) {
      $('channels').innerHTML = `<div class="bad">channels status failed: ${state.channels?.error?.message || 'unknown error'}</div>`;
    } else {
      // Expect array-ish; render generic.
      $('channels').innerHTML = `<pre>${JSON.stringify(channels, null, 2)}</pre>`;
    }

    // Sessions
    const sessions = safeGet(status, 'sessions', null);
    if (!sessions) {
      $('sessions').innerHTML = `<div class="small">No sessions field in status output.</div>`;
    } else {
      $('sessions').innerHTML = `<pre>${JSON.stringify(sessions, null, 2)}</pre>`;
    }

    // Cron
    const cronOk = state.cronStatus?.ok && state.cronJobs?.ok;
    if (!cronOk) {
      $('cron').innerHTML = `<pre>${JSON.stringify({ cronStatus: state.cronStatus, cronJobs: state.cronJobs }, null, 2)}</pre>`;
    } else {
      $('cron').innerHTML = `<pre>${JSON.stringify({ status: state.cronStatus.data, jobs: state.cronJobs.data }, null, 2)}</pre>`;
    }

    $('raw').textContent = JSON.stringify(state, null, 2);
  }

  async function refresh() {
    setPill('', 'fetching');
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const state = await r.json();
      setPill('ok', 'ok');
      render(state);
    } catch (e) {
      setPill('bad', 'error');
      $('raw').textContent = String(e?.message || e);
    }
  }

  $('refresh').addEventListener('click', refresh);
  refresh();
  setInterval(refresh, 15000);
</script>
</body>
</html>
